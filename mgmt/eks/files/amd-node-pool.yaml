apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: amd64
spec:
  weight: 50
  disruption:
    budgets:
      - nodes: 10%
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
  template:
    spec:
      expireAfter: 336h
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        # cheaper than your ARM R instances
        - key: eks.amazonaws.com/instance-category
          operator: In
          values:
            - t
            - m
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values:
            - "4"
        - key: eks.amazonaws.com/instance-cpu
          operator: Gte
          values:
            - "2"
      terminationGracePeriod: 24h